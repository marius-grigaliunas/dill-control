<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dill Control Project Board</title>
<link rel="stylesheet" href="css/board.css">
</head>
<body>
<div class="app">

  <header class="bar">
    <div class="brand">
      <h1 id="boardTitle">Dill Control</h1>
      <p>project board</p>
    </div>

    <div class="bar-group">
      <button class="btn primary" id="addBtn" type="button">+ Card <kbd>N</kbd></button>
      <button class="btn" id="addColBtn" type="button">+ Column</button>
    </div>

    <div class="search">
      <input type="text" id="search" placeholder="Search title, notes, labels" spellcheck="false"
             aria-label="Search cards">
      <kbd>/</kbd>
    </div>

    <span class="grow"></span>

    <span class="status" id="status"></span>
    <span class="status" id="fileStatus"></span>

    <div class="bar-group">
      <button class="btn icon" id="undoBtn" type="button" title="Undo" aria-label="Undo">&#8630;</button>
      <button class="btn icon" id="redoBtn" type="button" title="Redo" aria-label="Redo">&#8631;</button>
      <button class="btn" id="connectBtn" type="button" hidden>Connect folder</button>
      <button class="btn primary" id="reconnectBtn" type="button" hidden>Reconnect</button>
      <button class="btn" id="settingsBtn" type="button">Settings</button>
      <button class="btn icon" id="helpBtn" type="button" title="Keyboard shortcuts" aria-label="Keyboard shortcuts">?</button>
    </div>
  </header>

  <div class="filters" id="filters"></div>

  <main class="board" id="board" aria-label="Board"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<dialog id="cardDlg" aria-label="Card"></dialog>
<dialog id="bigDlg" aria-label="Board settings"></dialog>
<dialog id="smallDlg" class="narrow" aria-label="Dialog"></dialog>

<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/md.js"></script>
<script src="js/project.js"></script>
<script src="js/exports.js"></script>
<script src="js/dnd.js"></script>
<script src="js/render.js"></script>
<script src="js/editor.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
